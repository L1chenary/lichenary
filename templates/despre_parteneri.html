<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Partners & Sponsors - Lichenary</title>

<style>
  /* =========================================================
     LICHENARY — ORGANIC / EDITORIAL / CITIZEN SCIENCE
     Partners & Sponsors
     ========================================================= */

  :root {
    --cream: #f5f3ea;
    --cream-light: #fbfaf5;
    --paper: #eeece1;

    --forest: #173f35;
    --forest-dark: #102f28;
    --forest-soft: #315c4d;

    --moss: #718d57;
    --sage: #a8b89a;
    --lichen: #d9e4bb;

    --ink: #18231f;
    --muted: #65716a;

    --white: #ffffff;

    --radius-xl: 42px;
    --radius-lg: 28px;
    --radius-md: 18px;

    --shadow-soft: 0 20px 60px rgba(23, 63, 53, 0.10);
    --shadow-image: 0 30px 70px rgba(23, 63, 53, 0.18);
  }

  * {
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    padding: 0;

    min-height: 100vh;

    font-family:
      "Segoe UI",
      Tahoma,
      Geneva,
      Verdana,
      sans-serif;

    background: var(--cream);
    color: var(--ink);

    overflow-x: hidden;

    display: flex;
    flex-direction: column;

    position: relative;
  }

  a {
    color: inherit;
  }

  /* =========================================================
     BACKGROUND CANVAS
     ========================================================= */

  #cloud-canvas {
    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    z-index: 0;

    pointer-events: none;

    opacity: 0.12;
  }

  /* =========================================================
     HEADER
     ========================================================= */

  header {
    position: sticky;
    top: 0;

    z-index: 100;

    width: 100%;

    padding: 20px 5vw;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 30px;

    background: rgba(245, 243, 234, 0.88);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border-bottom:
      1px solid rgba(23, 63, 53, 0.08);
  }

  .logo {
    color: var(--forest);

    font-family:
      Georgia,
      "Times New Roman",
      serif;

    font-size: 1.7rem;

    font-weight: bold;

    letter-spacing: -0.04em;

    cursor: pointer;

    transition:
      transform 0.25s ease,
      color 0.25s ease;
  }

  .logo:hover {
    color: var(--moss);

    transform: translateY(-1px);
  }

  /* =========================================================
     NAVIGATION
     ========================================================= */

  nav {
    display: flex;

    align-items: center;
    justify-content: flex-end;

    gap: 5px;

    flex-wrap: wrap;
  }

  nav a {
    position: relative;

    color: var(--forest);

    text-decoration: none;

    padding: 9px 12px;

    font-size: 0.92rem;

    font-weight: 500;

    border-radius: 999px;

    white-space: nowrap;

    transition:
      color 0.25s ease,
      background 0.25s ease,
      transform 0.25s ease;
  }

  nav a:hover {
    color: var(--forest);

    background:
      rgba(113, 141, 87, 0.14);

    transform: translateY(-1px);
  }

  /* =========================================================
     BURGER
     ========================================================= */

  .burger {
    display: none;

    flex-direction: column;
    justify-content: center;

    gap: 5px;

    width: 42px;
    height: 42px;

    padding: 8px;

    cursor: pointer;

    border-radius: 50%;

    background: var(--forest);

    z-index: 30;
  }

  .burger div {
    width: 100%;
    height: 2px;

    background: white;

    border-radius: 10px;

    transition:
      transform 0.25s ease,
      opacity 0.25s ease;
  }

  /* =========================================================
     MAIN
     ========================================================= */

  main {
    position: relative;

    z-index: 10;

    width: 100%;
    max-width: 1320px;

    margin: 0 auto;

    padding:
      80px 5vw 120px;

    flex: 1;

    display: flex;

    align-items: center;
    justify-content: center;
  }

  /* =========================================================
     ORGANIC BACKGROUND ELEMENTS
     ========================================================= */

  main::before {
    content: "";

    position: absolute;

    width: 390px;
    height: 390px;

    top: 40px;
    left: -210px;

    background: var(--lichen);

    opacity: 0.45;

    border-radius:
      62% 38% 65% 35% /
      40% 57% 43% 60%;

    z-index: -1;
  }

  main::after {
    content: "";

    position: absolute;

    width: 320px;
    height: 320px;

    right: -180px;
    bottom: 20px;

    background: var(--sage);

    opacity: 0.20;

    border-radius:
      42% 58% 63% 37% /
      54% 40% 60% 46%;

    z-index: -1;
  }

  /* =========================================================
     PARTNERS SECTION
     ========================================================= */

  .partners-section {
    position: relative;

    width: 100%;

    min-height: 620px;

    padding:
      90px 80px;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    background:
      linear-gradient(
        135deg,
        var(--paper),
        #e5e8d8
      );

    border-radius:
      30px 110px 30px 120px;

    overflow: hidden;

    box-shadow: var(--shadow-soft);

    border:
      1px solid
      rgba(23, 63, 53, 0.07);

    opacity: 0;

    transform: translateY(35px);

    animation:
      pageReveal 0.9s ease forwards;
  }

  .partners-section::before {
    content: "";

    position: absolute;

    width: 390px;
    height: 390px;

    right: -130px;
    top: -150px;

    background: var(--sage);

    opacity: 0.25;

    border-radius:
      42% 58% 63% 37% /
      54% 40% 60% 46%;
  }

  .partners-section::after {
    content: "";

    position: absolute;

    width: 280px;
    height: 280px;

    left: -110px;
    bottom: -130px;

    background: var(--lichen);

    opacity: 0.60;

    border-radius:
      55% 45% 35% 65% /
      45% 58% 42% 55%;
  }

  /* =========================================================
     SMALL LABEL
     ========================================================= */

  .partners-label {
    position: relative;

    z-index: 2;

    margin-bottom: 25px;

    color: var(--moss);

    font-size: 0.78rem;

    font-weight: 700;

    letter-spacing: 0.18em;

    text-transform: uppercase;
  }

  /* =========================================================
     MAIN TITLE
     ========================================================= */

  h1 {
    position: relative;

    z-index: 2;

    max-width: 1000px;

    margin: 0 auto;

    color: var(--forest);

    font-family:
      Georgia,
      "Times New Roman",
      serif;

    font-size:
      clamp(4rem, 8vw, 7.5rem);

    line-height: 0.88;

    font-weight: normal;

    letter-spacing: -0.065em;
  }

  /* =========================================================
     DECORATIVE ORGANIC LINE
     ========================================================= */

  .organic-line {
    position: relative;

    z-index: 2;

    width: 130px;
    height: 4px;

    margin:
      35px auto 40px;

    background: var(--moss);

    border-radius: 999px;

    opacity: 0.7;
  }

  .organic-line::before,
  .organic-line::after {
    content: "";

    position: absolute;

    top: 50%;

    width: 7px;
    height: 7px;

    background: var(--moss);

    border-radius: 50%;

    transform: translateY(-50%);
  }

  .organic-line::before {
    left: -18px;
  }

  .organic-line::after {
    right: -18px;
  }

  /* =========================================================
     COMING SOON
     ========================================================= */

  .coming-soon {
    position: relative;

    z-index: 2;

    display: inline-flex;

    align-items: center;
    justify-content: center;

    padding:
      18px 28px;

    background: var(--forest);

    color: var(--white);

    border-radius:
      999px;

    box-shadow:
      0 15px 35px
      rgba(23, 63, 53, 0.20);

    font-size: 0.95rem;

    font-weight: 700;

    letter-spacing: 0.10em;

    text-transform: uppercase;

    transform: rotate(-2deg);

    transition:
      transform 0.3s ease,
      background 0.3s ease,
      box-shadow 0.3s ease;
  }

  .coming-soon:hover {
    transform:
      rotate(0deg)
      translateY(-3px);

    background: var(--moss);

    box-shadow:
      0 20px 40px
      rgba(23, 63, 53, 0.23);
  }

  /* =========================================================
     DECORATIVE LEAF / DOTS
     ========================================================= */

  .partners-decoration {
    position: absolute;

    z-index: 2;

    width: 100px;
    height: 100px;

    left: 11%;
    top: 15%;

    border:
      2px solid var(--sage);

    border-radius:
      67% 33% 52% 48% /
      44% 57% 43% 56%;

    transform:
      rotate(-22deg);

    opacity: 0.55;
  }

  .partners-decoration::after {
    content: "";

    position: absolute;

    width: 55px;
    height: 55px;

    right: -30px;
    bottom: -30px;

    background: var(--lichen);

    border-radius: 50%;

    opacity: 0.8;
  }

  /* =========================================================
     FOOTER
     ========================================================= */

  footer {
    position: relative;

    z-index: 10;

    width: 100%;

    padding:
      55px 20px 45px;

    background: var(--forest);

    color:
      rgba(255, 255, 255, 0.72);

    text-align: center;

    font-size: 0.85rem;

    letter-spacing: 0.03em;
  }

  footer::before {
    content: "";

    position: absolute;

    top: -35px;
    left: 0;

    width: 100%;
    height: 70px;

    background: var(--forest);

    clip-path:
      ellipse(55% 45% at 50% 100%);
  }

  /* =========================================================
     ANIMATION
     ========================================================= */

  @keyframes pageReveal {
    to {
      opacity: 1;

      transform:
        translateY(0);
    }
  }

  /* =========================================================
     RESPONSIVE — TABLET
     ========================================================= */

  @media (max-width: 1100px) {

    header {
      padding:
        18px 4vw;
    }

    main {
      padding-left: 4vw;
      padding-right: 4vw;
    }

    .partners-section {
      padding:
        75px 60px;

      min-height: 570px;

      border-radius:
        30px 90px 30px 85px;
    }

    .partners-decoration {
      left: 8%;
    }
  }

  /* =========================================================
     RESPONSIVE — MOBILE NAV
     ========================================================= */

  @media (max-width: 850px) {

    header {
      position: relative;

      flex-wrap: wrap;
    }

    .burger {
      display: flex;
    }

    nav {
      position: absolute;

      top: 100%;
      left: 0;

      width: 100%;

      max-height: 0;

      overflow: hidden;

      flex-direction: column;

      align-items: stretch;

      gap: 4px;

      padding:
        0 5vw;

      background:
        rgba(245, 243, 234, 0.97);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border-bottom:
        1px solid
        rgba(23, 63, 53, 0.08);

      transition:
        max-height 0.45s ease,
        padding 0.45s ease;
    }

    nav.open {
      max-height: 600px;

      padding-top: 15px;
      padding-bottom: 18px;
    }

    nav a {
      width: 100%;

      padding:
        13px 15px;

      border-radius: 14px;
    }

    body.menu-open main {
      margin-top: 250px;

      transition:
        margin-top 0.3s ease;
    }

    main {
      padding-top: 65px;
      padding-bottom: 90px;
    }

    .partners-section {
      min-height: 550px;

      padding:
        70px 50px;

      border-radius:
        30px 75px 30px 75px;
    }

    .partners-decoration {
      width: 75px;
      height: 75px;

      left: 8%;
      top: 12%;
    }
  }

  /* =========================================================
     RESPONSIVE — SMALL MOBILE
     ========================================================= */

  @media (max-width: 600px) {

    header {
      padding:
        15px 20px;
    }

    .logo {
      font-size: 1.5rem;
    }

    main {
      padding:
        55px 20px 80px;
    }

    .partners-section {
      min-height: 500px;

      padding:
        65px 28px;

      border-radius:
        28px 60px 28px 60px;
    }

    .partners-section::before {
      width: 250px;
      height: 250px;

      right: -100px;
      top: -90px;
    }

    .partners-section::after {
      width: 190px;
      height: 190px;

      left: -80px;
      bottom: -90px;
    }

    .partners-label {
      font-size: 0.68rem;

      letter-spacing: 0.14em;

      margin-bottom: 22px;
    }

    h1 {
      font-size:
        clamp(3.3rem, 16vw, 5rem);

      line-height: 0.9;
    }

    .organic-line {
      width: 90px;

      margin:
        30px auto 35px;
    }

    .coming-soon {
      padding:
        15px 22px;

      font-size: 0.78rem;
    }

    .partners-decoration {
      width: 60px;
      height: 60px;

      left: 7%;
      top: 10%;
    }

    footer {
      padding:
        45px 20px;
    }
  }

  /* =========================================================
     REDUCED MOTION
     ========================================================= */

  @media (prefers-reduced-motion: reduce) {

    html {
      scroll-behavior: auto;
    }

    *,
    *::before,
    *::after {
      animation-duration: 0.01ms !important;

      transition-duration: 0.01ms !important;
    }

    .partners-section {
      opacity: 1;

      transform: none;
    }
  }
</style>
</head>

<body>

<canvas id="cloud-canvas"></canvas>

<header>

  <div
    class="logo"
    onclick="window.location='{{ url_for('home') }}'"
  >
    Lichenary
  </div>

  <div
    id="burger"
    class="burger"
    aria-label="Menu"
    tabindex="0"
  >
    <div></div>
    <div></div>
    <div></div>
  </div>

  <nav id="nav-links">

    <a href="{{ url_for('home') }}">
      Home
    </a>

    <a href="{{ url_for('despre') }}">
      About
    </a>

    <a href="{{ url_for('participa') }}">
      How to Participate
    </a>

    <a href="{{ url_for('galerie') }}">
      Gallery
    </a>

    <a href="{{ url_for('harta') }}">
      Map
    </a>

    <a href="{{ url_for('contact') }}">
      Contact
    </a>

    {% if current_user.is_authenticated %}

      <a href="{{ url_for('dashboard') }}">
        Dashboard
      </a>

      <a href="{{ url_for('logout') }}">
        Logout
      </a>

    {% else %}

      <a href="{{ url_for('login') }}">
        Login
      </a>

      <a href="{{ url_for('register') }}">
        Register
      </a>

    {% endif %}

  </nav>

</header>


<main>

  <section class="partners-section">

    <div class="partners-decoration"></div>

    <div class="partners-label">
      Lichenary
    </div>

    <h1>
      Lichenary<br>
      Partners &amp; Sponsors
    </h1>

    <div class="organic-line"></div>

    <div class="coming-soon">
      Coming soon!
    </div>

  </section>

</main>


<footer>
  © 2025 Lichenary • All rights reserved
</footer>


<script>
  const burger = document.getElementById('burger');
  const navLinks = document.getElementById('nav-links');

  burger.addEventListener('click', () => {
    const isOpen = navLinks.classList.toggle('open');

    document.body.classList.toggle(
      'menu-open',
      isOpen
    );
  });

  // Închide meniul când se apasă un link (pe mobil)
  document
    .querySelectorAll('#nav-links a')
    .forEach(link => {

      link.addEventListener('click', () => {

        navLinks.classList.remove('open');

        document.body.classList.remove(
          'menu-open'
        );

      });

    });
</script>


<script>
  const canvas =
    document.getElementById('cloud-canvas');

  const ctx =
    canvas.getContext('2d');

  let width, height;


  function resize() {

    width = window.innerWidth;

    height = window.innerHeight;

    canvas.width = width;

    canvas.height = height;

  }


  window.addEventListener(
    'resize',
    resize
  );

  resize();


  class Cloud {

    constructor(
      x,
      y,
      size,
      color,
      speed
    ) {

      this.x = x;

      this.y = y;

      this.size = size;

      this.color = color;

      this.speed = speed;

    }


    draw(ctx) {

      let gradient =
        ctx.createRadialGradient(
          this.x,
          this.y,
          this.size * 0.3,
          this.x,
          this.y,
          this.size
        );


      gradient.addColorStop(
        0,
        this.color
      );

      gradient.addColorStop(
        1,
        'rgba(0,0,0,0)'
      );


      ctx.fillStyle = gradient;


      ctx.beginPath();


      ctx.arc(
        this.x,
        this.y,
        this.size,
        0,
        Math.PI * 2
      );


      ctx.fill();

    }


    update() {

      this.x += this.speed;


      if (
        this.x - this.size > width
      ) {

        this.x = -this.size;


        this.y =
          Math.random() * height * 0.8 +
          height * 0.1;

      }

    }

  }


  const clouds = [];


  const cloudColors = [

    'rgba(180,220,180,0.3)',

    'rgba(150,190,150,0.25)',

    'rgba(120,160,120,0.2)'

  ];


  for (
    let i = 0;
    i < 20;
    i++
  ) {

    clouds.push(

      new Cloud(

        Math.random() * width,

        Math.random() * height * 0.8 +
        height * 0.1,

        60 + Math.random() * 50,

        cloudColors[
          Math.floor(
            Math.random() *
            cloudColors.length
          )
        ],

        0.2 + Math.random() * 0.2

      )

    );

  }


  function animate() {

    ctx.clearRect(
      0,
      0,
      width,
      height
    );


    clouds.forEach(cloud => {

      cloud.draw(ctx);

      cloud.update();

    });


    requestAnimationFrame(animate);

  }


  animate();
</script>

</body>
</html>
