<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editează observația</title>

    <style>
        :root {
            --forest-dark: #102f29;
            --forest: #173f36;
            --forest-light: #2b6657;
            --sage: #91a998;
            --cream: #f3f0e7;
            --cream-light: #faf9f4;
            --white: #ffffff;
            --text: #17342d;
            --muted: #63756d;
            --accent: #c8d9c8;
            --border: rgba(23, 63, 54, 0.12);
            --shadow: 0 25px 70px rgba(19, 53, 45, 0.14);
        }

        * {
            box-sizing: border-box;
        }

        html {
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(200, 217, 200, 0.5),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 80%,
                    rgba(211, 224, 211, 0.55),
                    transparent 32%
                ),
                var(--cream);

            color: var(--text);

            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: "";

            position: fixed;

            width: 420px;
            height: 420px;

            border-radius:
                48% 52% 63% 37% /
                42% 36% 64% 58%;

            background: rgba(145, 169, 152, 0.12);

            top: -160px;
            left: -140px;

            z-index: 0;
            pointer-events: none;

            filter: blur(1px);
        }

        body::after {
            content: "";

            position: fixed;

            width: 500px;
            height: 500px;

            border-radius:
                63% 37% 44% 56% /
                58% 48% 52% 42%;

            background: rgba(190, 210, 193, 0.15);

            right: -200px;
            bottom: -180px;

            z-index: 0;
            pointer-events: none;
        }

        #cloud-canvas {
            position: fixed;

            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            z-index: 0;
            pointer-events: none;

            opacity: 0.35;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            position: relative;
            z-index: 20;

            width: 100%;

            padding: 20px 5%;

            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 30px;

            background: rgba(250, 249, 244, 0.82);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border-bottom: 1px solid rgba(23, 63, 54, 0.08);
        }

        .logo {
            font-size: 1.65rem;
            font-weight: 700;

            letter-spacing: -0.04em;

            color: var(--forest);

            cursor: pointer;
            white-space: nowrap;

            transition:
                opacity 0.25s ease,
                transform 0.25s ease;
        }

        .logo:hover {
            opacity: 0.7;
            transform: translateY(-1px);
        }

        /* =========================
           NAVIGATION
        ========================= */

        nav {
            display: flex;

            align-items: center;
            justify-content: flex-end;

            gap: 5px;

            z-index: 20;

            flex-wrap: wrap;
        }

        nav a {
            color: var(--forest);

            text-decoration: none;

            padding: 9px 13px;

            border-radius: 999px;

            white-space: nowrap;

            font-size: 0.92rem;
            font-weight: 500;

            transition:
                background 0.25s ease,
                color 0.25s ease,
                transform 0.25s ease;
        }

        nav a:hover {
            background: rgba(43, 102, 87, 0.1);

            color: var(--forest-light);

            transform: translateY(-1px);
        }

        /* =========================
           BURGER
        ========================= */

        .burger {
            display: none;

            flex-direction: column;

            justify-content: center;
            align-items: center;

            cursor: pointer;

            gap: 5px;

            width: 44px;
            height: 44px;

            border-radius: 50%;

            background: rgba(23, 63, 54, 0.08);

            z-index: 30;
        }

        .burger div {
            width: 20px;
            height: 2px;

            background-color: var(--forest);

            border-radius: 2px;

            transition:
                transform 0.25s ease,
                opacity 0.25s ease;
        }

        /* =========================
           MAIN
        ========================= */

        main {
            position: relative;
            z-index: 10;

            width: min(800px, 90%);

            margin: 0 auto;

            padding: 70px 0 90px;
        }

        /* =========================
           FORM CARD
        ========================= */

        .form-card {
            position: relative;

            padding: 38px;

            background: rgba(255, 255, 255, 0.72);

            border: 1px solid rgba(23, 63, 54, 0.08);

            border-radius: 30px;

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            box-shadow: var(--shadow);

            overflow: hidden;

            animation: formAppear 0.7s ease both;
        }

        .form-card::before {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            right: -80px;
            bottom: -90px;

            border-radius: 50%;

            background: rgba(145, 169, 152, 0.1);

            pointer-events: none;
        }

        @keyframes formAppear {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           PAGE TITLE
        ========================= */

        .page-intro {
            position: relative;
            z-index: 2;

            margin-bottom: 32px;

            text-align: center;
        }

        .page-intro::before {
            content: "OBSERVATION";

            display: block;

            width: fit-content;

            margin: 0 auto 16px;

            color: var(--forest-light);

            font-size: 0.78rem;
            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 0.16em;
        }

        header h1 {
            margin: 0;

            color: var(--forest-dark);

            font-size: clamp(1.8rem, 4vw, 2.45rem);

            line-height: 1.2;

            letter-spacing: -0.035em;
        }

        /* =========================
           FORM
        ========================= */

        form {
            position: relative;
            z-index: 2;
        }

        label {
            display: block;

            margin-top: 20px;
            margin-bottom: 7px;

            color: var(--forest-dark);

            font-size: 0.9rem;

            font-weight: 700;
        }

        label:first-of-type {
            margin-top: 0;
        }

        input,
        textarea {
            width: 100%;

            padding: 12px 14px;

            margin-top: 0;

            border: 1px solid rgba(23, 63, 54, 0.14);

            border-radius: 13px;

            background: rgba(250, 249, 244, 0.78);

            color: var(--text);

            font-family: inherit;

            font-size: 0.95rem;

            outline: none;

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        input:focus,
        textarea:focus {
            border-color: rgba(43, 102, 87, 0.45);

            background: rgba(255, 255, 255, 0.9);

            box-shadow:
                0 0 0 4px rgba(43, 102, 87, 0.08);
        }

        /* =========================
           ACTIONS
        ========================= */

        .actions {
            display: flex;

            flex-wrap: wrap;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            margin-top: 30px;
        }

        button {
            margin-top: 0;

            padding: 11px 22px;

            background-color: var(--forest);

            color: white;

            border: none;

            border-radius: 999px;

            cursor: pointer;

            font-family: inherit;

            font-size: 0.9rem;

            font-weight: 600;

            transition:
                background-color 0.25s ease,
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        button:hover {
            background-color: var(--forest-light);

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(23, 63, 54, 0.18);
        }

        .actions > div {
            text-align: right;
        }

        .link-button {
            text-decoration: none;

            color: var(--forest-light);

            font-weight: 600;

            font-size: 0.9rem;

            line-height: 2;

            transition:
                color 0.25s ease,
                opacity 0.25s ease;
        }

        .link-button:hover {
            text-decoration: none;

            color: var(--forest-dark);

            opacity: 0.75;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            position: relative;
            z-index: 10;

            padding: 24px 20px;

            background: var(--forest);

            color: rgba(255, 255, 255, 0.72);

            text-align: center;

            font-size: 0.85rem;

            letter-spacing: 0.01em;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 1050px) {

            header {
                padding-left: 4%;
                padding-right: 4%;
            }

            main {
                width: min(850px, 92%);

                padding-top: 60px;
            }

            .form-card {
                padding: 32px;
            }
        }

        @media (max-width: 768px) {

            header {
                padding: 15px 20px;
            }

            .logo {
                font-size: 1.45rem;
            }

            .burger {
                display: flex;
            }

            nav {
                position: absolute;

                top: 100%;
                left: 0;

                width: 100%;

                max-height: 0;

                overflow: hidden;

                flex-direction: column;

                align-items: stretch;

                gap: 4px;

                padding: 0 20px;

                background:
                    rgba(250, 249, 244, 0.96);

                backdrop-filter: blur(18px);
                -webkit-backdrop-filter: blur(18px);

                border-bottom:
                    1px solid rgba(23, 63, 54, 0.08);

                transition:
                    max-height 0.4s ease,
                    padding 0.4s ease;
            }

            nav.open {
                max-height: 600px;

                padding:
                    12px 20px 18px;
            }

            nav a {
                width: 100%;

                padding: 12px 14px;

                border-radius: 12px;
            }

            nav a:hover {
                transform: none;
            }

            main {
                width: min(92%, 620px);

                padding:
                    50px 0 65px;
            }

            .form-card {
                padding: 27px;

                border-radius: 25px;
            }

            header h1 {
                font-size: 1.75rem;
            }

            .actions {
                flex-direction: column;

                align-items: stretch;
            }

            .actions > div {
                text-align: center;
            }

            button {
                width: 100%;
            }
        }

        @media (max-width: 480px) {

            main {
                width: 90%;

                padding-top: 40px;
            }

            .form-card {
                padding: 22px 20px;

                border-radius: 21px;
            }

            .page-intro::before {
                font-size: 0.68rem;
            }

            header h1 {
                font-size: 1.5rem;
            }

            label {
                font-size: 0.86rem;
            }

            input,
            textarea {
                padding: 11px 12px;

                font-size: 0.92rem;
            }

            .link-button {
                font-size: 0.86rem;
            }

            footer {
                padding:
                    20px 12px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            html {
                scroll-behavior: auto;
            }

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;

                animation-iteration-count: 1 !important;

                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

<canvas id="cloud-canvas"></canvas>

<header>

    <div
        class="logo"
        onclick="window.location='/'"
    >
        Lichenary
    </div>

    <div
        id="burger"
        class="burger"
        aria-label="Menu"
        tabindex="0"
    >
        <div></div>
        <div></div>
        <div></div>
    </div>

    <nav id="nav-links">

        <a href="{{ url_for('dashboard') }}">
            Dashboard
        </a>

        <a href="{{ url_for('logout') }}">
            Logout
        </a>

    </nav>

</header>


<main>

    <div class="form-card">

        <div class="page-intro">
            <h1>
                Editează observația #{{ observation.id }}
            </h1>
        </div>

        <form method="POST">

            <label for="date_time">
                Data și ora observației:
            </label>

            <input
                type="datetime-local"
                id="date_time"
                name="date_time"
                value="{{ observation.date_time.strftime('%Y-%m-%dT%H:%M') }}"
                required
            >


            <label for="location">
                Locația:
            </label>

            <input
                type="text"
                id="location"
                name="location"
                value="{{ observation.location }}"
                required
            >


            <label for="latitude">
                Latitudine:
            </label>

            <input
                type="text"
                id="latitude"
                name="latitude"
                value="{{ observation.latitude }}"
                required
            >


            <label for="longitude">
                Longitudine:
            </label>

            <input
                type="text"
                id="longitude"
                name="longitude"
                value="{{ observation.longitude }}"
                required
            >


            <label for="species">
                Specie:
            </label>

            <input
                type="text"
                id="species"
                name="species"
                value="{{ observation.species or '' }}"
            >


            <label for="pollution_level">
                Nivel poluare (1-10):
            </label>

            <input
                type="number"
                id="pollution_level"
                name="pollution_level"
                value="{{ observation.pollution_level or '' }}"
                min="1"
                max="10"
            >


<div class="actions">

    <button type="submit">
        💾 Salvează modificările
    </button>

    <div>

        <a
            href="{{ url_for('admin_observations') }}"
            class="link-button"
        >
            ← Înapoi la observații neaprobate
        </a>

        <br>

        <a
            href="{{ url_for('dashboard') }}"
            class="link-button"
        >
            🏠 Înapoi la dashboard
        </a>

        <br>

        <a 
            href="{{ url_for('admin_approved_observations') }}"
            class="link-button"
        >
            ← Înapoi la observații aprobate
        </a>
    </div>

</div>

</form>

</div>

</main>

<footer>
    © 2025 Lichenary • All rights reserved
</footer>


<script>

    const burger =
        document.getElementById('burger');

    const navLinks =
        document.getElementById('nav-links');


    burger.addEventListener('click', () => {

        const isOpen =
            navLinks.classList.toggle('open');

        document.body.classList.toggle(
            'menu-open',
            isOpen
        );

    });


    document
        .querySelectorAll('#nav-links a')
        .forEach(link => {

            link.addEventListener('click', () => {

                navLinks.classList.remove('open');

                document.body.classList.remove(
                    'menu-open'
                );

            });

        });


    burger.addEventListener('keydown', (event) => {

        if (
            event.key === 'Enter' ||
            event.key === ' '
        ) {

            event.preventDefault();

            const isOpen =
                navLinks.classList.toggle('open');

            document.body.classList.toggle(
                'menu-open',
                isOpen
            );

        }

    });

</script>


<script>

    const canvas =
        document.getElementById('cloud-canvas');

    const ctx =
        canvas.getContext('2d');

    let width;
    let height;


    function resize() {

        width = window.innerWidth;

        height = window.innerHeight;

        canvas.width = width;

        canvas.height = height;

    }


    window.addEventListener(
        'resize',
        resize
    );

    resize();


    class Cloud {

        constructor(
            x,
            y,
            size,
            color,
            speed
        ) {

            this.x = x;
            this.y = y;
            this.size = size;
            this.color = color;
            this.speed = speed;

        }


        draw(ctx) {

            const gradient =
                ctx.createRadialGradient(
                    this.x,
                    this.y,
                    this.size * 0.3,
                    this.x,
                    this.y,
                    this.size
                );


            gradient.addColorStop(
                0,
                this.color
            );

            gradient.addColorStop(
                1,
                'rgba(0,0,0,0)'
            );


            ctx.fillStyle = gradient;


            ctx.beginPath();


            ctx.arc(
                this.x,
                this.y,
                this.size,
                0,
                Math.PI * 2
            );


            ctx.fill();

        }


        update() {

            this.x += this.speed;


            if (
                this.x - this.size > width
            ) {

                this.x = -this.size;

                this.y =
                    Math.random() * height * 0.8 +
                    height * 0.1;

            }

        }

    }


    const clouds = [];


    const cloudColors = [

        'rgba(180,220,180,0.18)',

        'rgba(150,190,150,0.14)',

        'rgba(120,160,120,0.11)'

    ];


    cloudColors.forEach(color => {

        for (
            let i = 0;
            i < 8;
            i++
        ) {

            clouds.push(

                new Cloud(

                    Math.random() * width,

                    Math.random() * height,

                    60 +
                        Math.random() * 50,

                    color,

                    0.15 +
                        Math.random() * 0.2

                )

            );

        }

    });


    function animate() {

        ctx.clearRect(
            0,
            0,
            width,
            height
        );


        clouds.forEach(cloud => {

            cloud.draw(ctx);

            cloud.update();

        });


        requestAnimationFrame(
            animate
        );

    }


    animate();

</script>

</body>
</html>
